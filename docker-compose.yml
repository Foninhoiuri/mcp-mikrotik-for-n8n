version: '3.8'

services:
  mikrotik-mcp:
    build: .
    container_name: mcp_mikrotik
    restart: unless-stopped
    ports:
      - "3000:${MIKROTIK_MCP__PORT:-8000}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${MIKROTIK_MCP__PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
